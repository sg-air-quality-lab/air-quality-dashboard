name: Collect NEA readings

on:
  schedule:
    - cron: '7 * * * *'   # backup only: GitHub often skips these; Supabase pg_cron starts the run at :10 (see supabase/migrations)
  workflow_dispatch:
    inputs:
      from:
        description: 'Backfill start date (YYYY-MM-DD), leave empty for yesterday'
        required: false
      to:
        description: 'Backfill end date (YYYY-MM-DD), leave empty for today'
        required: false

permissions:
  contents: read

concurrency:
  group: collect-nea
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test collector/*.test.mjs
      - name: Collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: |
          if [ -n "$FROM" ] && [ -n "$TO" ]; then
            node collector/collect-nea.mjs "$FROM" "$TO"
          elif [ -n "$FROM" ]; then
            node collector/collect-nea.mjs "$FROM"
          else
            node collector/collect-nea.mjs
          fi
